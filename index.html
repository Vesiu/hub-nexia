<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexia Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav"><b>🌸 Nexia Hub</b><div class="acts"><button class="tgl" id="tgl" type="button" aria-pressed="false">🌙 Sombre</button><button class="admin" id="adm" type="button">Admin</button></div></header>
<main>
  <section class="hero">
    <div class="avatar"><span aria-hidden="true">🧠</span><img src="photo.jpg" alt="Photo de Nexia" onerror="this.remove()"></div>
    <h1>Nexia ✨</h1>
    <p class="sub">Streameuse sur TikTok</p>
  </section>
  <div id="live" data-k="live"></div>
  <section data-k="nets"><h2 class="sec">RETROUVE NEXIA PARTOUT</h2><div class="nets" id="nets"></div></section>
  <section data-k="pseudos"><h2 class="sec">SES PSEUDOS EN JEU</h2><div class="nets" id="ps"></div></section>
  <div data-k="calc"><a class="calc" href="#">⚖️ Ouvrir le calculateur de trade &amp; shop</a></div>
  <section data-k="shop"><h2 class="sec">🧠 SHOP STEAL A BRAINROT</h2><div class="grid" id="shop"></div></section>
</main>
<div class="bar" id="bar"><span><b id="n">0</b> brainrot · <b id="t">0 €</b></span><button class="btn">Proposer un trade</button></div>
<script src="script.js"></script>
</body>
</html>
